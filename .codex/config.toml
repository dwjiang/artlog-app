[mcp_servers.expo]
url = "https://mcp.expo.dev/mcp"

[mcp_servers.convex]
command = "npx"
args = ["-y", "convex@latest", "mcp", "start"]
startup_timeout_sec = 60

[mcp_servers.convex.env]
# Use the saved Convex login; deployment keys fail MCP's account authorization check.
CONVEX_DEPLOY_KEY = ""
CONVEX_DEPLOYMENT_TOKEN = ""

[mcp_servers.XcodeBuildMCP]
command = "npx"
args = ["-y", "xcodebuildmcp@latest", "mcp"]
startup_timeout_sec = 60
tool_timeout_sec = 600

[mcp_servers.huggingface]
url = "https://huggingface.co/mcp?login"

[mcp_servers.tavily]
url = "https://mcp.tavily.com/mcp/"

[mcp_servers.mobbin]
url = "https://api.mobbin.com/mcp"

[mcp_servers.sentry]
url = "https://mcp.sentry.dev/mcp"

[mcp_servers.XcodeBuildMCP.env]
XCODEBUILDMCP_ENABLED_WORKFLOWS = "simulator,ui-automation,debugging"

[mcp_servers.nebius]
command = "uvx"
args = [
  "--python",
  "3.13",
  "--refresh-package",
  "nebius-mcp-server",
  "nebius-mcp-server@git+https://github.com/nebius/mcp-server@main",
]

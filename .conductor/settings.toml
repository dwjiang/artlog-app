"$schema" = "https://conductor.build/schemas/settings.repo.schema.json"

[prompts]
create_pr = """
Before creating the pull request, rename the current workspace branch to a concise, descriptive name based on the completed work, unless it already has an appropriate descriptive name. Follow the repository's existing branch naming conventions. Then push the renamed branch and create the pull request against the configured default branch.

Title the pull request as a Conventional Commit: `type(scope): summary`. Keep the summary imperative, lowercase, and without a trailing period.

- Type: one of `feat`, `fix`, `docs`, `refactor`, `perf`, `test`, `build`, `ci`, or `chore`.
- Scope: derive it from the diff, never from earlier pull request titles. Run `git diff --name-only origin/main...HEAD` and map each path to an area:
  - `src/components/<area>/`, `src/lib/<area>/`, `shared/<area>/` → `<area>`, for example `scan`, `social`, `visits`, `collection`, `settings`, `account`, `venue`, `capture`, `label`, `journal`, `wall`, `queue`.
  - `src/app/` → `routes`. Top-level files in `src/components/` plus `src/constants/` → `ui`.
  - `convex/` → `convex`; `src/db/` → `db`; `modules/<name>/` → `<name>`; `scripts/` → `scripts`; `docs/` → `docs`.
  - `AGENTS.md` and `.agents/` → `agents`; `.conductor/` → `conductor`; `app.json`, `tsconfig.json`, `eslint.config.js`, `.env.example` → `config`; `package.json` and the lockfile → `deps`.
  - Any other path: the directory or subsystem that owns it.
- Use the area the summary is about. When the summary spans several areas, use the area holding at least half of the changed files; when none does, use `ui` for a restyle and omit the scope for any other repository-wide change.
- `app` is not a scope. Do not use it or any other catch-all.
"""

[scripts]
setup = "npm ci --no-audit --no-fund"
archive = '''
set -e
[ "${CONDUCTOR_IS_LOCAL:-0}" = "1" ] || exit 0
archive_source=$(git show "origin/${CONDUCTOR_DEFAULT_BRANCH:-main}:.conductor/archive-workspace.cjs")
printf '%s\n' "$archive_source" | node
'''
# Switching workspaces should replace the server used by the shared development client.
run_mode = "nonconcurrent"

[scripts.run.iOS]
available_in = ["local"]
command = '''
printf 'Artlog workspace: %s\n' "$CONDUCTOR_WORKSPACE_NAME"
exec npx expo start --dev-client --ios --port "${CONDUCTOR_PORT:?Run this from a Conductor workspace}"
'''
default = true
icon = "monitor"

[scripts.run.iPhone]
available_in = ["local"]
command = '''
printf 'Artlog workspace: %s\n' "$CONDUCTOR_WORKSPACE_NAME"
exec npx expo start --dev-client --lan --port "${CONDUCTOR_PORT:?Run this from a Conductor workspace}"
'''
icon = "smartphone"

[scripts.run."Rebuild iOS"]
available_in = ["local"]
command = '''
: "${CONDUCTOR_PORT:?Run this from a Conductor workspace}"
printf 'Artlog workspace: %s\n' "$CONDUCTOR_WORKSPACE_NAME"
npx expo prebuild --platform ios --clean && exec npm run ios -- --device --port "$CONDUCTOR_PORT"
'''
icon = "wrench"

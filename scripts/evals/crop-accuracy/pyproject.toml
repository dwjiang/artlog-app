[project]
name = "artlog-crop-accuracy-eval"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["httpx>=0.28,<0.29", "numpy>=2,<3", "opencv-python-headless>=4.10,<5"]

[dependency-groups]
dev = ["pytest>=8,<10"]

[tool.pytest.ini_options]
python_files = ["*.test.py"]
addopts = "--import-mode=importlib"
pythonpath = ["."]

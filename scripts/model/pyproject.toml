[project]
name = "artlog-model-export"
version = "0.1.0"
description = "Exports the C-RADIOv3-B embedding model to CoreML for the artlog app"
requires-python = ">=3.11,<3.12"
# Changing coremltools or torch can change the exported numerics and therefore the model version.
dependencies = [
    "torch==2.7.0",
    "torchvision==0.22.0",
    "timm==1.0.15",
    "coremltools==9.0",
    "huggingface_hub==0.34.4",
    "numpy==1.26.4",
    "pillow==11.3.0",
    "requests==2.34.2",
    "einops==0.8.1",
]

[dependency-groups]
dev = ["pytest>=8,<10"]

[tool.uv]
package = false

[tool.pytest.ini_options]
python_files = ["*_test.py"]
testpaths = ["."]
